  <h1>aws-tui Five-Layer Architecture</h1>
  <p>Four service lanes, explicit ownership, and composition-only demo substitutions</p>
  <section class="frame">

      <title id="title">aws-tui S3, EMR Serverless, Glue, and Athena five-layer architecture</title>
      <desc id="desc">S3, EMR Serverless, AWS Glue, and Amazon Athena flow through Textual view, VMx view model, service, domain, infrastructure, and external service boundaries. Domain adapters perform runtime AWS + filesystem I/O. Infrastructure owns sessions + SDK client construction and credentials, config, OS-backed stores. Content replacement must await hosted VM shutdown, then dispose outgoing VM. Demo providers sit outside production layers and are selected only by composition.</desc>

      <g id="textual-views"><desc>DualPane mounted by service_view_factory.py; ContextPicker and ServiceTabStrip serve GluePage and AthenaPage.</desc></g>
      <g id="viewmodels"><desc>ServiceSelectionStore and TableClipboardVM support GluePageVM with GlueCatalogVM, GlueJobsVM, and GlueCrawlersVM; AthenaPageVM owns AthenaQueryVM, AthenaHistoryVM, AthenaResultsVM, and AthenaSavedVM.</desc></g>
      <g id="domain-models"><desc>S3FS + LocalFS feed CrossFsCopy / Move and TransferJournal. EMR Serverless Client uses an S3 log adapter. Glue uses IcebergInspector and AthenaQueryRunner with TableRef and QueryContext.</desc></g>
      <g id="infrastructure"><desc>ConnectionResolver resolves exact connection + region selection and constructs SDK client contexts.</desc></g>
      <g id="cross-service-handoffs"><desc>Glue-to-Athena uses OpenAthenaTableRequest; Athena uses OpenGlueTableRequest and OpenS3LocationRequest. Snapshot time travel follows the same app transaction. TableClipboardVM handles CopyTableReferenceRequest for copy quoted table ref and same-source insert.</desc></g>
