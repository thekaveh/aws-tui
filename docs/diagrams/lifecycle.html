<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aws-tui Lifecycle and Cancellation</title>
  <style>
    @font-face { font-family: "Fira Code Embedded"; src: url("../../assets/fonts/fira-code/FiraCode-Regular.ttf") format("truetype"); font-style: normal; font-weight: 400; }
    @font-face { font-family: "Fira Code Embedded"; src: url("../../assets/fonts/fira-code/FiraCode-Bold.ttf") format("truetype"); font-style: normal; font-weight: 600 700; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px; background: #020617; color: #f8fafc; font-family: "Fira Code Embedded", monospace; }
    main { width: min(1600px, 100%); margin: auto; }
    h1 { margin: 0; font-size: 24px; letter-spacing: 0; }
    p { margin: 8px 0 0; color: #94a3b8; font-size: 14px; }
    .frame { margin-top: 20px; padding: 16px; overflow-x: auto; border: 1px solid #1e293b; border-radius: 8px; background: #07101f; }
    svg { display: block; width: 100%; min-width: 1120px; height: auto; }
  </style>
</head>
<body>
<main>
  <h1>aws-tui Lifecycle and Cancellation</h1>
  <p>Hosted-service replacement, candidate rollback, and one ordered shutdown path</p>
  <section class="frame">
    <svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
      <title id="title">aws-tui lifecycle and cancellation</title>
      <desc id="desc">The source switch resolves and builds a candidate while prior content stays authoritative. The content host constructs the candidate, drains and disposes outgoing content, commits identity during adoption, and starts setup in the background. Candidate construction failures keep the prior service. Explicit quit and unmount share one ordered shutdown task.</desc>
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="0.5"/></pattern>
        <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker>
      </defs>
      <rect width="1600" height="900" fill="#020617"/><rect width="1600" height="900" fill="url(#grid)"/>
      <g fill="#07101f" stroke="#1e293b" stroke-width="1.5">
        <rect x="30" y="35" width="1540" height="260" rx="8"/>
        <rect x="30" y="315" width="1540" height="290" rx="8"/>
        <rect x="30" y="625" width="1540" height="240" rx="8"/>
      </g>
      <g font-family="Fira Code Embedded" font-size="12" font-weight="700" text-anchor="start">
        <text x="52" y="63" fill="#34d399">CONTENTHOSTVM SERVICE REPLACEMENT</text>
        <text x="52" y="343" fill="#fbbf24">SOURCE REBUILD TRANSACTION</text>
        <text x="52" y="653" fill="#fb7185">COMMON QUIT + FATAL UNMOUNT SHUTDOWN</text>
      </g>

      <g fill="none" stroke-width="2" marker-end="url(#arrow)">
        <path d="M280 155H340" stroke="#34d399"/><path d="M580 155H650" stroke="#34d399"/>
        <path d="M890 155H960" stroke="#34d399"/><path d="M1200 155H1270" stroke="#22d3ee"/>
        <path d="M1390 205V230" stroke="#fb923c"/>
        <path d="M280 425H340" stroke="#fbbf24"/><path d="M580 425H650" stroke="#fbbf24"/>
        <path d="M890 425H960" stroke="#34d399"/>
        <path d="M1200 425H1270" stroke="#22d3ee"/>
        <path d="M770 475V515" stroke="#fb7185"/><path d="M890 555H960" stroke="#fb7185"/>
        <path d="M300 755H390" stroke="#fb7185"/><path d="M650 755H740" stroke="#fb7185"/>
        <path d="M1000 755H1090" stroke="#fb7185"/><path d="M1350 755H1430" stroke="#fb7185"/>
      </g>

      <g font-family="Fira Code Embedded" text-anchor="middle">
        <g fill="#0f172a" stroke-width="2">
          <rect x="50" y="105" width="230" height="100" rx="5" stroke="#34d399"/>
          <rect x="340" y="105" width="240" height="100" rx="5" stroke="#34d399"/>
          <rect x="650" y="105" width="240" height="100" rx="5" stroke="#34d399"/>
          <rect x="960" y="105" width="240" height="100" rx="5" stroke="#34d399"/>
          <rect x="1270" y="105" width="240" height="100" rx="5" stroke="#22d3ee"/>
          <rect x="1270" y="230" width="240" height="45" rx="5" stroke="#fb923c"/>
        </g>
        <g fill="#f8fafc" font-size="10.5" font-weight="700">
          <text x="165" y="140">Replacement requested</text><text x="460" y="140">Construct candidate</text>
          <text x="770" y="140">Drain outgoing</text><text x="1080" y="140">Adopt candidate</text>
          <text x="1390" y="140">Start setup task</text><text x="1390" y="258">Report setup error</text>
        </g>
        <g fill="#94a3b8" font-size="9">
          <text x="165" y="168">serialized content mutation</text><text x="460" y="168">structural failure stops here</text>
          <text x="770" y="168">shutdown · destruct · dispose</text><text x="1080" y="168">new content is authoritative</text>
          <text x="1390" y="168">background operation</text>
        </g>

        <g fill="#0f172a" stroke-width="2">
          <rect x="50" y="375" width="230" height="100" rx="5" stroke="#fbbf24"/>
          <rect x="340" y="375" width="240" height="100" rx="5" stroke="#fbbf24"/>
          <rect x="650" y="375" width="240" height="100" rx="5" stroke="#fbbf24"/>
          <rect x="960" y="375" width="240" height="100" rx="5" stroke="#34d399"/>
          <rect x="650" y="515" width="240" height="80" rx="5" stroke="#fb7185"/>
          <rect x="960" y="515" width="240" height="80" rx="5" stroke="#fb7185"/>
          <rect x="1270" y="375" width="240" height="100" rx="5" stroke="#22d3ee"/>
        </g>
        <g fill="#f8fafc" font-size="10.5" font-weight="700">
          <text x="165" y="410">Resolve target source</text><text x="460" y="410">Build candidate VM</text>
          <text x="770" y="410">Construct candidate tree</text><text x="1080" y="410">Drain + adopt candidate</text>
          <text x="770" y="548">Construction failure</text><text x="1080" y="548">Keep prior service</text>
          <text x="1390" y="410">Background setup</text>
        </g>
        <g fill="#94a3b8" font-size="9">
          <text x="165" y="438">exact connection + region</text><text x="460" y="438">Prior content stays authoritative</text>
          <text x="770" y="438">construction precedes teardown</text><text x="1080" y="438">drain · dispose · commit · publish</text>
          <text x="770" y="575">dispose rejected candidate</text><text x="1080" y="575">selection + identity unchanged</text>
          <text x="1390" y="438">error is visible; no rollback</text>
        </g>

        <g fill="#0f172a" stroke="#fb7185" stroke-width="2">
          <rect x="50" y="705" width="250" height="100" rx="5"/>
          <rect x="390" y="705" width="260" height="100" rx="5"/>
          <rect x="740" y="705" width="260" height="100" rx="5"/>
          <rect x="1090" y="705" width="260" height="100" rx="5"/>
          <rect x="1430" y="705" width="110" height="100" rx="5"/>
        </g>
        <g fill="#f8fafc" font-size="10.5" font-weight="700">
          <text x="175" y="742">Close intake</text><text x="520" y="742">Cancel + drain</text>
          <text x="870" y="742">Close AWS clients</text><text x="1220" y="742">Flush + dispose</text>
          <text x="1485" y="750">Done</text>
        </g>
        <g fill="#94a3b8" font-size="9">
          <text x="175" y="770">one idempotent task</text><text x="520" y="770">transfers · setup · queries · preview</text>
          <text x="870" y="770">await async context exits</text><text x="1220" y="770">logs · subscriptions · VM tree</text>
        </g>
      </g>
    </svg>
  </section>
</main>
</body>
</html>
