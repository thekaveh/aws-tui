# Adobe S3Mock container for local aws-tui development.
#
# Usage:
#   scripts/test-services/s3/up.sh    # start + seed
#   scripts/test-services/s3/down.sh  # stop (data preserved on the named volume)
#   scripts/test-services/s3/down.sh --purge   # stop AND wipe volume
#
# S3 endpoint: http://localhost:9000

services:
  # The named volume's mountpoint is created root-owned, but the S3Mock image
  # runs as uid 1000 (cnb) and writes bucket directories directly into the
  # store root. Without this one-shot chown every CreateBucket fails with
  # HTTP 500 InternalError. Runs as root only long enough to hand the volume
  # to the unprivileged runtime user.
  s3mock-init:
    image: adobe/s3mock:5.2.0@sha256:7a37f0d796e81a28b970c892dcae532797014616b3312b467af8f0274ebf0c26
    container_name: aws-tui-dev-s3mock-init
    user: "0:0"
    entrypoint: ["sh", "-c", "chown 1000:1000 /containers3root"]
    volumes:
      - aws-tui-dev-s3mock-data:/containers3root
    restart: "no"

  s3mock:
    depends_on:
      s3mock-init:
        condition: service_completed_successfully
    # Pinned by tag + digest for supply-chain reproducibility — a
    # breaking change upstream can't silently wedge the local dev seed
    # flow with no immutable version to revert to.
    image: adobe/s3mock:5.2.0@sha256:7a37f0d796e81a28b970c892dcae532797014616b3312b467af8f0274ebf0c26
    container_name: aws-tui-dev-s3mock
    ports:
      - "127.0.0.1:9000:9090"   # S3 API
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /containers3root
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - aws-tui-dev-s3mock-data:/containers3root
    healthcheck:
      # ListBuckets, not /favicon.ico: the static endpoint answers 200 before
      # the object store is touched, so it reports healthy on a container whose
      # store is unusable. A real S3 operation exercises the store root.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  aws-tui-dev-s3mock-data:
    name: aws-tui-dev-s3mock-data
