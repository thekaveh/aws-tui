# Adobe S3Mock container for local aws-tui development.
#
# Usage:
#   scripts/test-services/s3/up.sh    # start + seed
#   scripts/test-services/s3/down.sh  # stop (data preserved on the named volume)
#   scripts/test-services/s3/down.sh --purge   # stop AND wipe volume
#
# S3 endpoint: http://localhost:9000

services:
  s3mock:
    # Pinned by tag + digest for supply-chain reproducibility — a
    # breaking change upstream can't silently wedge the local dev seed
    # flow with no immutable version to revert to.
    image: adobe/s3mock:5.2.0@sha256:7a37f0d796e81a28b970c892dcae532797014616b3312b467af8f0274ebf0c26
    container_name: aws-tui-dev-s3mock
    ports:
      - "127.0.0.1:9000:9090"   # S3 API
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /containers3root
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    volumes:
      - aws-tui-dev-s3mock-data:/containers3root
    healthcheck:
      # S3Mock's always-on readiness endpoint. seed.py also polls the S3 API.
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/favicon.ico"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    restart: unless-stopped

volumes:
  aws-tui-dev-s3mock-data:
    name: aws-tui-dev-s3mock-data
