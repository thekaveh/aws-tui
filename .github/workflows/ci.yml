name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege: every job in this workflow only reads
# the repo and writes ephemeral actions-storage artifacts. No token
# scope above `contents: read` is needed.
permissions:
  contents: read

env:
  UV_VERSION: "0.11.19"

jobs:
  unit:
    name: unit (${{ matrix.os }} / py${{ matrix.python }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: sync
        run: uv sync --frozen --python ${{ matrix.python }}
      # Runs unit + the in-process integration files (full-app pilot,
      # modal forwarding, etc. — they intentionally lack the
      # `integration` marker per pyproject's addopts comment). The
      # MinIO testcontainer tier is excluded by the default
      # `-m 'not integration'` addopts and runs in the integration job
      # below.
      - name: pytest (unit + in-process integration)
        run: uv run --python ${{ matrix.python }} pytest tests/unit tests/integration -v

  integration:
    name: integration (MinIO testcontainer)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: pytest (integration tier)
        run: uv run pytest tests/integration -m integration -v

  coverage:
    name: coverage floor (py3.12)
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: pytest coverage (unit + in-process integration)
        run: uv run --python 3.12 pytest tests/unit tests/integration --cov=aws_tui --cov-report=term-missing --cov-report=xml

  snapshot:
    name: snapshot (Textual SVG goldens / ${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: pytest (snapshot tier)
        run: uv run pytest tests/snapshot -v

  e2e:
    name: e2e (user journeys)
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: pytest (e2e tier)
        run: uv run pytest tests/e2e -v

  lint-type:
    name: lint + type
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: install Python 3.11 for pre-commit hooks
        run: uv python install 3.11
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: layer rules
        run: ./scripts/check-layers.sh
      # Surfaces every hook defined in .pre-commit-config.yaml:
      # ruff, ruff-format, mypy, end-of-file-fixer, trailing-whitespace,
      # check-yaml, check-toml, mixed-line-ending, taplo-format,
      # taplo-lint. Single source of truth — when a hook fails CI fails;
      # a contributor who skips ``pre-commit install`` or commits with
      # ``--no-verify`` is still gated. Previously CI ran ruff / ruff
      # format / mypy as dedicated steps AND again via this hook
      # invocation, doubling the slowest gate (mypy) on every push.
      - name: pre-commit (all hooks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  security:
    name: dependency audit (py${{ matrix.python }})
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python ${{ matrix.python }}
        run: uv python install ${{ matrix.python }}
      - name: export locked requirements
        run: uv export --frozen --python ${{ matrix.python }} --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/requirements-audit.txt"
      - name: pip-audit (locked dependencies)
        run: uv run --python ${{ matrix.python }} pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --require-hashes --disable-pip

  pkg:
    name: package build
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync
        run: uv sync --frozen --python 3.12
      - name: build wheel + sdist
        run: uv build --no-build-isolation
      - name: twine check
        run: uv run twine check dist/*
      - name: upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 14

  docs:
    name: documentation contracts
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install libcairo2
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: install Python 3.12
        run: uv python install 3.12
      - name: sync (docs group)
        run: uv sync --frozen --python 3.12 --group docs
      - name: documentation drift and strict build
        run: make docs-check
      - name: pytest (documentation contracts)
        run: uv run pytest tests/docs -v

  gate:
    name: ci gate
    timeout-minutes: 5
    if: always()
    needs: [unit, integration, coverage, snapshot, e2e, lint-type, security, pkg, docs]
    runs-on: ubuntu-24.04
    steps:
      - name: require every CI tier
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          IFS=',' read -ra results <<< "$RESULTS"
          for result in "${results[@]}"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::one or more required CI tiers did not complete successfully: $RESULTS" >&2
              exit 1
            fi
          done
          echo "all required CI tiers completed successfully: $RESULTS"
