name: pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/screenshots/aws-tui-running.png"
      - "docs/**"
      - "scripts/docs/**"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

env:
  UV_VERSION: 0.11.19

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install libcairo2
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --locked --group docs
      - name: documentation drift and strict build
        run: make docs-check
      - name: documentation contract tests
        run: uv run pytest tests/docs -v
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    timeout-minutes: 10
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  wiki:
    timeout-minutes: 15
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install libcairo2
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv python install 3.12
      - run: uv sync --locked --group docs
      - name: write wiki deploy key
        env:
          WIKI_DEPLOY_KEY: ${{ secrets.WIKI_DEPLOY_KEY }}
        run: |
          if [[ -z "${WIKI_DEPLOY_KEY:-}" ]]; then
            echo "::error::WIKI_DEPLOY_KEY is not configured" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$WIKI_DEPLOY_KEY" > ~/.ssh/wiki_key
          chmod 600 ~/.ssh/wiki_key
      - name: build + push wiki
        env:
          WIKI_DEPLOY_KEY: /home/runner/.ssh/wiki_key
        run: |
          uv run python -m scripts.docs.build_docs --wiki
          uv run python -m scripts.docs.push_wiki --push
